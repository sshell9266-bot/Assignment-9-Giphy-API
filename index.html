<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment #9: Giphy API</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
        crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="./css/style.css" rel="stylesheet" />
</head>

<body>
    <div class="container my-5">
        <h1 class="mb-4 text-center">Fetch a GIF</h1>

        <!-- Search input -->
        <div class="row justify-content-center mb-3">
            <div class="col-md-6">
                <input
                    type="text"
                    id="search-input"
                    class="form-control"
                    placeholder="Search for a GIF"
                    aria-label="Search for a GIF"
                />
            </div>
        </div>

        <!-- Button to fetch GIFs -->
        <div class="d-flex justify-content-center mb-4">
            <button id="fetch-gif-btn" class="btn btn-primary">
                Fetch a GIF
            </button>
        </div>

        <!-- Status messages for loading, errors, and empty results -->
        <p id="status-message" class="text-center" role="status" aria-live="polite"></p>

        <!-- Container for dynamically displayed GIFs -->
        <div id="gif-container" class="row justify-content-center">
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
